<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cronfoundry mocks</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  body{padding:60px 40px;max-width:780px;margin:0 auto}
  h1{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
  .lede{color:var(--ink-2);margin:0 0 36px;font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.04em}
  .pages{display:grid;gap:14px}
  .pages a{
    display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
    padding:18px 22px;border:1px solid var(--rule);background:var(--bg-2);
    border-radius:3px;transition:all .12s;
  }
  .pages a:hover{border-color:var(--green);background:var(--bg-3)}
  .pages a .num{
    font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink-3);
    border:1px solid var(--rule-2);padding:2px 7px;border-radius:2px;
  }
  .pages a strong{font-size:15px;font-weight:500;color:var(--ink)}
  .pages a span.desc{display:block;color:var(--ink-3);font-family:"Geist Mono",monospace;font-size:11.5px;margin-top:3px}
  .pages a .arrow{font-family:"Geist Mono",monospace;color:var(--ink-3)}
  .pages a:hover .arrow{color:var(--green)}
</style>
</head>
<body>
<h1><span style="color:var(--green)">cron</span>foundry mocks</h1>
<p class="lede">ui-job-detail-mock · v0.1 · 4 pages</p>

<div class="pages">
  <a href="overview.html">
    <span class="num">01</span>
    <div>
      <strong>Overview</strong>
      <span class="desc">triage · failures first, upcoming next, 24h activity</span>
    </div>
    <span class="arrow">→</span>
  </a>
  <a href="jobs.html">
    <span class="num">02</span>
    <div>
      <strong>Jobs</strong>
      <span class="desc">primary index · all scheduled jobs across repos</span>
    </div>
    <span class="arrow">→</span>
  </a>
  <a href="job-detail.html">
    <span class="num">03</span>
    <div>
      <strong>Job detail</strong>
      <span class="desc">nightly-backup · the debugging hub</span>
    </div>
    <span class="arrow">→</span>
  </a>
  <a href="run-detail.html">
    <span class="num">04</span>
    <div>
      <strong>Run detail</strong>
      <span class="desc">run #2841 · timeline, error, full logs</span>
    </div>
    <span class="arrow">→</span>
  </a>
</div>
</body>
</html>
