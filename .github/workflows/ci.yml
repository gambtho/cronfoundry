name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cronfoundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/webapi has //go:embed all:web/dist; populate a stub so the
      # Go compiler is happy without paying for a Vite build on unit tests.
      - name: Stub web/dist for embed
        run: make web-stub

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          TEST_DATABASE_URL: postgres://cf:cf@localhost:5432/cronfoundry_test?sslmode=disable
        run: go test ./... -timeout 10m

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.0

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # E2E test exercises the API but not the UI itself; stub is enough.
      - name: Stub web/dist for embed
        run: make web-stub

      - name: make e2e
        run: make e2e

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Real bundle here — this job stands in for "what the docker image will
      # actually ship to operators."
      - name: Build web bundle
        run: make web

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build ./cmd/cronfoundry
          CGO_ENABLED=0 go build ./cmd/runner

      - name: Build Docker image (no push)
        run: docker build -f deploy/Dockerfile -t cronfoundry:ci-check .
