name: Release

# Tag-driven release. Three stages:
#
#   release-amd64 (~10 min, runs first)
#       Native amd64 build of the serve image. Publishes :VERSION,
#       :VERSION-MAJOR.MINOR, :latest as single-arch (amd64) manifests
#       so amd64-only consumers (ACA consumption, fly.io, the AKS chart's
#       default node pool) can pull immediately. Also creates the GitHub
#       Release with deploy artifacts.
#
#   release-arm64 (~10 min, runs in parallel with amd64)
#       Native arm64 build on the GitHub-hosted ubuntu-24.04-arm runner
#       (GA + free for public repos). Publishes :VERSION-arm64,
#       :VERSION-MAJOR.MINOR-arm64, :latest-arm64 — never races the
#       amd64 manifest for the same version. Cache scope is separate
#       (scope=arm64) so the two jobs' BuildKit caches don't fight.
#
#   release-merge (~30s, depends on both)
#       Combines the platform-specific manifests into a multi-arch
#       manifest under the unsuffixed tags. After this runs, :VERSION
#       satisfies pulls from both amd64 and arm64 nodes — restoring the
#       behavior consumers (e.g. the AKS chart) had before the split.
#       Until release-arm64 finishes, :VERSION is amd64-only; that
#       window is acceptable because every actively-deployed env we
#       support is amd64.

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cronfoundry

jobs:
  release-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Build the React bundle into internal/webapi/web/dist BEFORE docker
      # build, since the Go binary embeds it via //go:embed all:web/dist.
      - name: Build web bundle
        run: make web

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push serve image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Bundle deploy artifacts
        run: |
          tar -czf cronfoundry-azure-deploy-${{ github.ref_name }}.tar.gz \
            azure.yaml deploy/main.bicep deploy/params.example.json deploy/modules

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cronfoundry-azure-deploy-${{ github.ref_name }}.tar.gz

  release-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        run: make web

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with -arm64 suffix so it never races the amd64 manifest
      # for the same semantic version. Operators who actually need arm64
      # (rare today) reference :VERSION-arm64 explicitly.
      - name: Extract serve metadata (arm64)
        id: meta-arm64
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-arm64,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push serve image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-arm64.outputs.tags }}
          labels: ${{ steps.meta-arm64.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  release-merge:
    runs-on: ubuntu-latest
    needs: [release-amd64, release-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the semver pieces from the v* tag (refs/tags/v0.7.13 →
      # 0.7.13). docker/metadata-action handles this on the build jobs;
      # the merge job derives the same values from the ref directly so we
      # don't need to thread outputs between jobs.
      - name: Compute tags
        id: tags
        run: |
          ref="${GITHUB_REF#refs/tags/v}"   # 0.7.13
          major_minor="${ref%.*}"           # 0.7
          {
            echo "version=$ref"
            echo "major_minor=$major_minor"
          } >> "$GITHUB_OUTPUT"

      # Combine the platform-specific tags into a single multi-arch
      # manifest at the unsuffixed tag. Serve is the only image we
      # publish; the operation is ~30s — a manifest update, not a rebuild.
      - name: Merge serve manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          V: ${{ steps.tags.outputs.version }}
          MM: ${{ steps.tags.outputs.major_minor }}
        run: |
          for t in "$V" "$MM" "latest"; do
            docker buildx imagetools create -t "${IMAGE}:${t}" \
              "${IMAGE}:${t}" "${IMAGE}:${t}-arm64"
          done
